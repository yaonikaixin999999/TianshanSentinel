services:
  backend:
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    volumes:
      - ./runtime:/app/runtime
      - ./artifacts:/app/artifacts:ro
    ports:
      - "8000:8000"
  frontend:
    build:
      context: .
      dockerfile: deploy/frontend.Dockerfile
    depends_on:
      - backend
    ports:
      - "8080:80"

