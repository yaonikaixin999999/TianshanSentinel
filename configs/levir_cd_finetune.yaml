project:
  name: TianshanSentinel-FineTune
  seed: 2026

data:
  root: ./data/LEVIR-CD
  image_size: 256
  num_workers: 4
  batch_size: 8
  domain_augment: true
  time_swap_probability: 0.5
  photometric_probability: 0.8
  photometric_strength: 0.22
  shadow_probability: 0.3
  blur_probability: 0.15

model:
  encoder: resnet18
  pretrained: false
  dropout: 0.15

train:
  epochs: 30
  learning_rate: 0.00005
  weight_decay: 0.0001
  amp: true
  patience: 8
  threshold: 0.5
  init_checkpoint: ./artifacts/levir_cd_run/best.pt
  loss_weights:
    bce: 0.5
    dice: 0.4
    boundary: 0.1

output:
  directory: ./artifacts/levir_cd_finetune
