project:
  name: TianshanSentinel
  seed: 2026

data:
  root: ./data/LEVIR-CD
  image_size: 256
  num_workers: 4
  batch_size: 8

model:
  encoder: resnet18
  pretrained: true
  dropout: 0.15

train:
  epochs: 80
  learning_rate: 0.0003
  weight_decay: 0.0001
  amp: true
  patience: 12
  threshold: 0.5
  loss_weights:
    bce: 0.5
    dice: 0.4
    boundary: 0.1

output:
  directory: ./artifacts/levir_cd_run

