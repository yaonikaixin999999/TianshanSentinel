[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tianshan-sentinel"
version = "1.0.0"
description = "Explainable bi-temporal remote-sensing change detection platform"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
  "fastapi==0.115.8",
  "uvicorn[standard]==0.34.0",
  "python-multipart==0.0.20",
  "pydantic-settings==2.7.1",
  "Pillow==11.1.0",
  "numpy==2.1.3",
  "opencv-python-headless==4.11.0.86",
  "python-docx==1.1.2",
  "reportlab==4.2.5",
  "PyYAML==6.0.2",
  "tqdm==4.67.1",
]

[project.optional-dependencies]
inference = [
  "onnxruntime==1.20.1",
]
train = [
  "torch==2.5.1",
  "torchvision==0.20.1",
  "pyarrow==18.1.0",
  "onnx==1.17.0",
  "onnxruntime==1.20.1",
  "tensorboard==2.18.0",
]
test = [
  "pytest==8.3.4",
  "httpx==0.28.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"
