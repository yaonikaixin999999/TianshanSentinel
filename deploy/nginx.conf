server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
    }
    location /runtime/ {
        proxy_pass http://backend:8000/runtime/;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}

